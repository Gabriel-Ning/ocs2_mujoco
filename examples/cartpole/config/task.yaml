# CartPole MPC Configuration (YAML Format)
# This configuration file defines the optimal control problem for the cart-pole swing-up task.
# State: [theta, x, theta_dot, x_dot] where theta is the pole angle (0 = upright)
# Input: [force] applied to the cart

# CartPole physical parameters
cartpole_parameters:
  cartMass: 2.0        # Cart mass [kg]
  poleMass: 0.2        # Pole mass [kg]
  poleLength: 1.0      # Pole length [m]
  maxInput: 5.0        # Maximum force [N]
  gravity: 9.81        # Gravitational acceleration [m/s^2]

# DDP (Differential Dynamic Programming) settings
ddp:
  algorithm: SLQ                      # SLQ or ILQR
  nThreads: 1                         # Number of threads
  maxNumIterations: 1                 # Max iterations per MPC step (warm start)
  minRelCost: 0.1                     # Minimum relative cost improvement
  constraintTolerance: 1e-3           # Constraint violation tolerance
  displayInfo: true                   # Display iteration info
  displayShortSummary: false          # Display short summary
  checkNumericalStability: false      # Check numerical stability
  AbsTolODE: 1e-9                     # Absolute ODE tolerance
  RelTolODE: 1e-6                     # Relative ODE tolerance
  maxNumStepsPerSecond: 100000        # Max ODE steps per second
  timeStep: 1e-3                      # Integration time step
  backwardPassIntegratorType: ODE45   # Backward pass integrator
  inequalityConstraintMu: 100.0       # Inequality constraint penalty
  inequalityConstraintDelta: 1.1      # Inequality constraint delta
  preComputeRiccatiTerms: true        # Pre-compute Riccati terms
  useFeedbackPolicy: false            # Use feedback policy
  strategy: LINE_SEARCH               # Search strategy
  lineSearch:
    minStepLength: 1e-3               # Minimum step length
    maxStepLength: 1.0                # Maximum step length
    hessianCorrectionStrategy: EIGENVALUE_MODIFICATION
    hessianCorrectionMultiple: 1e-6

# Rollout settings for forward simulation
rollout:
  AbsTolODE: 1e-9                     # Absolute ODE tolerance
  RelTolODE: 1e-6                     # Relative ODE tolerance
  timeStep: 1e-2                      # Rollout time step
  maxNumStepsPerSecond: 100000        # Max ODE steps per second
  checkNumericalStability: false      # Check numerical stability
  integratorType: ODE45               # Integrator type

# MPC settings
mpc:
  timeHorizon: 5.0                    # Time horizon [s]
  solutionTimeWindow: -1              # Maximum solution window [s], -1 = unlimited
  coldStart: false                    # Cold start MPC each iteration
  debugPrint: false                   # Debug print
  mpcDesiredFrequency: 200            # MPC update frequency [Hz]
  mrtDesiredFrequency: 1000           # MRT tracking frequency [Hz]

# Bounds penalty configuration (for soft constraints)
bounds_penalty_config:
  scale: 0.1                          # Penalty scaling
  stepSize: 1.0                       # Step size

# Initial state: pole hanging down (theta = pi)
# State: [theta, x, theta_dot, x_dot]
initialState:
  "(0,0)": 3.14                       # theta (pole angle) - starts at pi (hanging down)
  "(1,0)": 0.0                        # x (cart position)
  "(2,0)": 0.0                        # theta_dot (angular velocity)
  "(3,0)": 0.0                        # x_dot (cart velocity)

# State weight matrix Q (intermediate cost)
# Zero weights mean no penalty during trajectory, only at final time
Q:
  scaling: 1.0
  "(0,0)": 0.0                        # theta weight
  "(1,1)": 0.0                        # x weight
  "(2,2)": 0.0                        # theta_dot weight
  "(3,3)": 0.0                        # x_dot weight

# Control weight matrix R
R:
  scaling: 1.0
  "(0,0)": 0.1                        # force weight

# Final state weight matrix Q_final (terminal cost)
Q_final:
  scaling: 1.0
  "(0,0)": 5.0                        # theta weight (upright)
  "(1,1)": 1.0                        # x weight (return to origin)
  "(2,2)": 1.0                        # theta_dot weight (zero velocity)
  "(3,3)": 1.0                        # x_dot weight (zero velocity)

# Final goal state: pole upright at origin
x_final:
  "(0,0)": 0.0                        # theta = 0 (upright)
  "(1,0)": 0.0                        # x = 0 (at origin)
  "(2,0)": 0.0                        # theta_dot = 0
  "(3,0)": 0.0                        # x_dot = 0
