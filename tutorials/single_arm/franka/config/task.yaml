# Franka Panda Mobile Manipulator MPC Configuration (YAML Format)
# This configuration file defines the optimal control problem for end-effector tracking.
#
# Manipulator Types:
#   0: Default-arm (fixed base, 7 DOF)
#   1: Wheel-based manipulator (mobile base + arm)
#   2: Floating-arm manipulator (6 DOF base + arm)
#   3: Fully actuated floating-arm manipulator (6 DOF actuated base + arm)

# Robot model meta-information
model_information:
  manipulatorModelType: 0             # 0 = Default-arm (fixed base Franka Panda)
  # Joints to consider fixed (e.g., gripper fingers)
  removeJoints:
    - "panda_finger_joint1"
    - "panda_finger_joint2"
  baseFrame: "root"                   # Base frame of the robot (from URDF)
  eeFrame: "panda_hand_tcp"           # End-effector frame (from URDF)

# Model settings
model_settings:
  usePreComputation: true             # Use pre-computation for efficiency
  recompileLibraries: true            # Recompile CppAD libraries

# DDP (Differential Dynamic Programming) settings
ddp:
  algorithm: SLQ                      # SLQ or ILQR
  nThreads: 3                         # Number of threads
  threadPriority: 50                  # Thread priority (0-99)
  maxNumIterations: 3                 # Max iterations per MPC step
  minRelCost: 0.1                     # Minimum relative cost improvement
  constraintTolerance: 1e-3           # Constraint violation tolerance
  displayInfo: false                  # Display iteration info
  displayShortSummary: false          # Display short summary
  checkNumericalStability: false      # Check numerical stability
  debugPrintRollout: false            # Debug print rollout
  debugCaching: false                 # Debug caching
  AbsTolODE: 1e-5                     # Absolute ODE tolerance
  RelTolODE: 1e-3                     # Relative ODE tolerance
  maxNumStepsPerSecond: 100000        # Max ODE steps per second
  timeStep: 1e-2                      # Integration time step
  backwardPassIntegratorType: ODE45   # Backward pass integrator
  constraintPenaltyInitialValue: 20.0 # Initial constraint penalty
  constraintPenaltyIncreaseRate: 2.0  # Penalty increase rate
  preComputeRiccatiTerms: true        # Pre-compute Riccati terms
  useFeedbackPolicy: false            # Use feedback policy
  strategy: LINE_SEARCH               # Search strategy
  lineSearch:
    minStepLength: 1e-2               # Minimum step length
    maxStepLength: 1.0                # Maximum step length
    hessianCorrectionStrategy: DIAGONAL_SHIFT
    hessianCorrectionMultiple: 1e-3

# Rollout settings for forward simulation
rollout:
  AbsTolODE: 1e-5                     # Absolute ODE tolerance
  RelTolODE: 1e-3                     # Relative ODE tolerance
  timeStep: 1e-3                      # Rollout time step
  integratorType: ODE45               # Integrator type
  maxNumStepsPerSecond: 100000        # Max ODE steps per second
  checkNumericalStability: false      # Check numerical stability

# MPC settings
mpc:
  timeHorizon: 1.0                    # Time horizon [s]
  solutionTimeWindow: 0.2             # Maximum solution window [s]
  coldStart: false                    # Cold start MPC each iteration
  debugPrint: false                   # Debug print
  mpcDesiredFrequency: 200            # MPC update frequency [Hz]
  mrtDesiredFrequency: 400            # MRT tracking frequency [Hz]

# Initial state configuration
# Separate base and arm initial states for different manipulator types
initialState:
  # Base DOF initial states (for different manipulator types)
  base:
    # Default manipulator has no base DOFs
    defaultManipulator: {}

    # Floating arm manipulator: 6 DOF (position + euler angles)
    floatingArmManipulator:
      "(0,0)": 0.0                    # position x
      "(1,0)": 0.0                    # position y
      "(2,0)": 0.5                    # position z
      "(3,0)": 0.0                    # euler angle z
      "(4,0)": 0.0                    # euler angle y
      "(5,0)": 1.7                    # euler angle x

    # Fully actuated floating arm manipulator
    fullyActuatedFloatingArmManipulator:
      "(0,0)": 0.0                    # position x
      "(1,0)": 0.0                    # position y
      "(2,0)": 0.0                    # position z
      "(3,0)": 0.0                    # euler angle z
      "(4,0)": 0.0                    # euler angle y
      "(5,0)": 0.0                    # euler angle x

    # Wheel-based mobile manipulator: SE(2)
    wheelBasedMobileManipulator:
      "(0,0)": 0.0                    # position x
      "(1,0)": 0.0                    # position y
      "(2,0)": 0.0                    # heading

  # Arm DOF initial state (7 joints for Franka Panda)
  arm:
    "(0,0)": 0.0                      # arm_1 (shoulder pan)
    "(1,0)": 0.171                    # arm_2 (shoulder lift)
    "(2,0)": 0.114                    # arm_3 (elbow)
    "(3,0)": -1.570                   # arm_4 (wrist 1)
    "(4,0)": 0.050                    # arm_5 (wrist 2)
    "(5,0)": 1.570                    # arm_6 (wrist 3)
    "(6,0)": 0.469                    # arm_7 (tool)

# Input cost configuration
inputCost:
  R:
    # Base DOF input costs (for different manipulator types)
    base:
      defaultManipulator: {}

      floatingArmManipulator: {}

      fullyActuatedFloatingArmManipulator:
        scaling: 1e-2
        "(0,0)": 5.0                  # position x velocity
        "(1,1)": 5.0                  # position y velocity
        "(2,2)": 5.0                  # position z velocity
        "(3,3)": 5.0                  # euler angle z velocity
        "(4,4)": 5.0                  # euler angle y velocity
        "(5,5)": 5.0                  # euler angle x velocity

      wheelBasedMobileManipulator:
        scaling: 1e-2
        "(0,0)": 5.0                  # forward velocity
        "(1,1)": 5.0                  # turning velocity

    # Arm DOF input costs
    arm:
      scaling: 1e-2
      "(0,0)": 1.0                    # arm_1 velocity
      "(1,1)": 1.0                    # arm_2 velocity
      "(2,2)": 1.0                    # arm_3 velocity
      "(3,3)": 1.0                    # arm_4 velocity
      "(4,4)": 1.0                    # arm_5 velocity
      "(5,5)": 1.0                    # arm_6 velocity
      "(6,6)": 1.0                    # arm_7 velocity

# End-effector tracking cost
endEffector:
  muPosition: 50.0                    # Position tracking penalty scaling
  muOrientation: 25.0                 # Orientation tracking penalty scaling

# Final end-effector tracking cost
finalEndEffector:
  muPosition: 50.0                    # Position tracking penalty scaling
  muOrientation: 25.0                 # Orientation tracking penalty scaling

# Self-collision avoidance configuration
selfCollision:
  activate: true                      # Enable self-collision avoidance

  # Collision object pairs (by index)
  collisionObjectPairs: []

  # Collision link pairs (by name)
  collisionLinkPairs:
    - "panda_link1, panda_hand"

  minimumDistance: 0.05               # Minimum distance allowed [m]
  mu: 1e-2                            # Relaxed log barrier mu
  delta: 1e-3                         # Relaxed log barrier delta

# Joint position limits configuration (from URDF)
jointPositionLimits:
  activate: false                     # Enable joint position limits
  mu: 1e-3                            # Relaxed log barrier mu
  delta: 1e-4                         # Relaxed log barrier delta

# Joint velocity limits configuration
jointVelocityLimits:
  mu: 0.01                            # Relaxed log barrier mu
  delta: 1e-3                         # Relaxed log barrier delta

  lowerBound:
    # Base DOF velocity lower bounds
    base:
      defaultManipulator: {}

      floatingArmManipulator: {}

      fullyActuatedFloatingArmManipulator:
        "(0,0)": -0.1                 # linear velocity x
        "(1,0)": -0.1                 # linear velocity y
        "(2,0)": -0.1                 # linear velocity z
        "(3,0)": -0.3                 # euler angle velocity z
        "(4,0)": -0.3                 # euler angle velocity y
        "(5,0)": -0.3                 # euler angle velocity x

      wheelBasedMobileManipulator:
        "(0,0)": -0.1                 # forward velocity
        "(1,0)": -0.3                 # turning velocity

    # Arm DOF velocity lower bounds
    arm:
      "(0,0)": -2.1750                # arm_1 [rad/s]
      "(1,0)": -2.1750                # arm_2 [rad/s]
      "(2,0)": -2.1750                # arm_3 [rad/s]
      "(3,0)": -2.1750                # arm_4 [rad/s]
      "(4,0)": -2.6100                # arm_5 [rad/s]
      "(5,0)": -2.6100                # arm_6 [rad/s]
      "(6,0)": -2.6100                # arm_7 [rad/s]

  upperBound:
    # Base DOF velocity upper bounds
    base:
      defaultManipulator: {}

      floatingArmManipulator: {}

      fullyActuatedFloatingArmManipulator:
        "(0,0)": 0.1                  # linear velocity x
        "(1,0)": 0.1                  # linear velocity y
        "(2,0)": 0.1                  # linear velocity z
        "(3,0)": 0.3                  # euler angle velocity z
        "(4,0)": 0.3                  # euler angle velocity y
        "(5,0)": 0.3                  # euler angle velocity x

      wheelBasedMobileManipulator:
        "(0,0)": 0.1                  # forward velocity
        "(1,0)": 0.3                  # turning velocity

    # Arm DOF velocity upper bounds
    arm:
      "(0,0)": 2.1750                 # arm_1 [rad/s]
      "(1,0)": 2.1750                 # arm_2 [rad/s]
      "(2,0)": 2.1750                 # arm_3 [rad/s]
      "(3,0)": 2.1750                 # arm_4 [rad/s]
      "(4,0)": 2.6100                 # arm_5 [rad/s]
      "(5,0)": 2.6100                 # arm_6 [rad/s]
      "(6,0)": 2.6100                 # arm_7 [rad/s]